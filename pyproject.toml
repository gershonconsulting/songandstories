[project]
name = "songandstories"
version = "0.1.0"
description = "Rewrite a YouTube song's lyrics around your story and re-sing it"
requires-python = ">=3.10"
dependencies = [
    "anthropic>=0.40.0",
    "yt-dlp>=2024.10.0",
    "openai-whisper>=20240930",
    "demucs>=4.0.1",
    "pydub>=0.25.1",
    "click>=8.1.0",
    "rich>=13.7.0",
]

[project.scripts]
songandstories = "songandstories.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
